name: Complete DFU-ImageGuard repository bootstrap
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  extract-complete-repository:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Extract checksum-verified implementation
        run: python bootstrap_payload.py
      - name: Validate generated repository
        run: |
          python -m pip install -q nbformat pytest
          python scripts/build_notebooks.py
          python scripts/validate_repository.py
          pytest -q tests/test_static_acceptance.py
      - name: Commit complete implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'Implement conference-complete leakage-safe DFU-ImageGuard pipeline'
            git push origin main
          fi
