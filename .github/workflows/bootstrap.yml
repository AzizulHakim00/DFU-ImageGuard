name: Bootstrap DFU-ImageGuard repository
on:
  push:
    branches: [main]
    paths:
      - bootstrap_payload.py
      - .github/workflows/bootstrap.yml
permissions:
  contents: write
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Extract complete repository payload
        run: python bootstrap_payload.py
      - name: Validate generated repository
        run: |
          python -m pip install -q nbformat pytest
          python scripts/validate_repository.py
          pytest -q tests/test_static_acceptance.py
      - name: Commit generated implementation
        run: |
          git config user.name "DFU-ImageGuard Bootstrap"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Implement conference-complete DFU-ImageGuard pipeline"
            git push origin main
          fi
