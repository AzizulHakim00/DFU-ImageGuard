name: Assemble DFU-PolarMorphNet single-file source

on:
  workflow_dispatch:
  push:
    paths:
      - '.assembly/polarmorphnet/**'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Assemble and verify source
        shell: bash
        run: |
          if ! compgen -G '.assembly/polarmorphnet/chunk_*.b64' > /dev/null; then
            echo 'No PolarMorphNet assembly chunks remain; nothing to do.'
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib

          chunks = sorted(Path('.assembly/polarmorphnet').glob('chunk_*.b64'))
          encoded = ''.join(path.read_text(encoding='utf-8') for path in chunks)
          data = base64.b64decode(encoded, validate=True)
          expected_sha = '75f358b68e5fd36fe3490adfb62cd3e359815b7970e36a0ab4f2b86a72ed9b47'
          actual_sha = hashlib.sha256(data).hexdigest()
          if actual_sha != expected_sha:
              raise SystemExit(f'SHA-256 mismatch: {actual_sha} != {expected_sha}')
          destination = Path('polarmorphnet/DFU_PolarMorphNet_AllInOne.py')
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_bytes(data)
          print(f'Assembled {destination} | bytes={len(data)} | sha256={actual_sha}')
          PY
          python -m py_compile polarmorphnet/DFU_PolarMorphNet_AllInOne.py
          rm -rf .assembly/polarmorphnet

      - name: Commit assembled source
        shell: bash
        run: |
          if git diff --quiet -- polarmorphnet/DFU_PolarMorphNet_AllInOne.py .assembly/polarmorphnet; then
            echo 'No assembled changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- polarmorphnet/DFU_PolarMorphNet_AllInOne.py
          git add -u -- .assembly/polarmorphnet
          git commit -m 'Assemble DFU-PolarMorphNet all-in-one source'
          git push origin HEAD:${{ github.ref_name }}
