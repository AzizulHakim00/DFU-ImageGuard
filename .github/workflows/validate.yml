name: Validate DFU-ImageGuard

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install static validator
        run: python -m pip install --disable-pip-version-check ruff==0.12.5
      - name: Compile Python sources
        run: python -m compileall -q src scripts
      - name: Detect undefined names
        run: ruff check src scripts --select F821,F822,F823
      - name: Validate notebooks and required structure
        run: python scripts/validate_repository.py
