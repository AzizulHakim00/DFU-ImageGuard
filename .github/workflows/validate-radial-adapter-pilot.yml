name: Validate radial adapter pilot

on:
  push:
    branches: [radial-adapter-pilot-v1]
  pull_request:
    paths:
      - "src/radial_*"
      - "tests/test_radial_*"
      - "tests/test_verdict_logic.py"
      - "notebooks/DFU_RadialAdapter_*"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest torch numpy pandas
      - run: python -m py_compile src/checkpoint_backup.py src/radial_adapter_model.py src/radial_pilot_runner.py
      - run: pytest -q tests/test_radial_adapter_geometry.py tests/test_verdict_logic.py tests/test_checkpoint_chunking.py
      - name: Compile notebook cells
        run: |
          python - <<'PY'
          import json, pathlib
          for path in pathlib.Path('notebooks').glob('DFU_RadialAdapter_*OneCell.ipynb'):
              nb=json.loads(path.read_text())
              code='\n'.join(''.join(c.get('source',[])) for c in nb['cells'] if c['cell_type']=='code')
              compile(code,str(path),'exec')
              print('PASS',path)
          PY
