name: Validate radial adapter pilot

on:
  push:
    branches: [radial-adapter-pilot-v1]
  pull_request:
    paths:
      - "src/radial_*"
      - "src/checkpoint_backup.py"
      - "tests/test_radial_*"
      - "tests/test_checkpoint_chunking.py"
      - "tests/test_verdict_logic.py"
      - "notebooks/DFU_RadialAdapter_*"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - name: Apply one-time source repair
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/radial_pilot_runner.py')
          text = path.read_text(encoding='utf-8')
          bad = "    patience_left: int,\n) \n    return {"
          good = "    patience_left: int,\n) -> dict[str, Any]:\n    return {"
          if bad in text:
              path.write_text(text.replace(bad, good, 1), encoding='utf-8')
              print('Applied source repair')
          elif good in text:
              print('Source already repaired')
          else:
              raise SystemExit('Expected checkpoint signature was not found')
          PY
          if ! git diff --quiet -- src/radial_pilot_runner.py; then
            git config user.name "DFU-ImageGuard CI"
            git config user.email "actions@users.noreply.github.com"
            git add -- src/radial_pilot_runner.py
            git commit -m "Fix radial pilot checkpoint signature"
            git push origin HEAD:radial-adapter-pilot-v1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest torch numpy pandas
      - run: python -m py_compile src/checkpoint_backup.py src/radial_adapter_model.py src/radial_pilot_runner.py
      - run: pytest -q tests/test_radial_adapter_geometry.py tests/test_verdict_logic.py tests/test_checkpoint_chunking.py
      - name: Compile notebook cells
        run: |
          python - <<'PY'
          import json, pathlib
          for path in pathlib.Path('notebooks').glob('DFU_RadialAdapter_*OneCell.ipynb'):
              nb=json.loads(path.read_text())
              code='\n'.join(''.join(c.get('source',[])) for c in nb['cells'] if c['cell_type']=='code')
              compile(code,str(path),'exec')
              print('PASS',path)
          PY
